services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
      environment:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      volumes:
        - elastic_data:/usr/share/elasticsearch/data
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s' || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 30
        start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_INDEX: ${ELASTIC_INDEX}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  import_csv:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_INDEX: ${ELASTIC_INDEX}
    volumes:
      - ./data:/app/data
    command: ["uv", "run", "python", "-m", "app.scripts.import_csv", "/app/data/posts.csv"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      import_csv:
        condition: service_completed_successfully
    environment:
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_INDEX: ${ELASTIC_INDEX}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  elastic_data:
